plugins {
    id 'com.android.application'
}

def qrLinkHost = providers.gradleProperty('qrLinkHost').getOrElse('qr.example.com')
if (qrLinkHost.length() > 253 || !(qrLinkHost ==~ /[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*/)) {
    throw new GradleException('qrLinkHost must be a lowercase DNS hostname without a scheme, port, or path.')
}

android {
    namespace 'com.dualscan.zelleqr.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dualscan.zelleqr.sample'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        manifestPlaceholders = [qrLinkHost: qrLinkHost]
        buildConfigField 'String', 'QR_LINK_HOST', '"' + qrLinkHost + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':zelleqrlink')
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
